name: Deploy + nightly data refresh

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # nightly refresh of roll-call votes + simplifications
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      # Build-time data refresh. Keys come ONLY from GitHub Secrets — never committed.
      - run: npm run data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VOTE_LIMIT: '30'
      - run: npm run build
      - run: npm run check:no-secrets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
